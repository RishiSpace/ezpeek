[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ezpeek"
version = "0.1.0"
description = "LAN remote-desktop with FFmpeg + Qt"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "zeroconf>=0.80",
    "dbus-python>=1.3.2;platform_system=='Linux'",
    "PyGObject>=3.42;platform_system=='Linux'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff"]

[project.scripts]
ezpeek = "ezpeek.cli:main"

[tool.setuptools.packages.find]
include = ["ezpeek*"]
exclude = ["server*", "tests*"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
